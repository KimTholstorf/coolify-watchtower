# coolify-watchtower - builds the image from this repository.
# Coolify: deploy the GitHub repo with the Docker Compose build pack and
# Docker Compose Location /docker-compose.build.yml.
# Set COOLIFY_TOKEN in the Environment Variables tab. Everything else has a sensible default.
# Leave "Connect to Predefined Network" OFF: only the updater joins the coolify network,
# so other containers there can't reach the socket proxy (which exposes container env vars).
services:
  updater:
    build: .
    environment:
      - COOLIFY_URL=${COOLIFY_URL:-http://coolify:8080}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN}
      - DRY_RUN=${DRY_RUN:-false}
      - TZ=${TZ:-}
      - TASK_NAME=${TASK_NAME:-auto-update}
      - AUTO_UPDATE_LABEL=${AUTO_UPDATE_LABEL:-coolify.auto-update}
      - DEFAULT_SCHEDULE=${DEFAULT_SCHEDULE:-daily}
      - REPORT_ON_START=${REPORT_ON_START:-true}
      - NOTIFY_URL=${NOTIFY_URL:-}
      - SELF_UPDATE=${SELF_UPDATE:-daily}
      - DOCKER_HOST=tcp://socket-proxy:2375
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 180)"]
      interval: 60s
      timeout: 10s
      start_period: 5m
      retries: 3
    depends_on:
      socket-proxy:
        condition: service_healthy
    restart: unless-stopped

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      - default
    restart: unless-stopped

networks:
  coolify:
    external: true
