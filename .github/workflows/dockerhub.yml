name: dockerhub

# copy: copies each version-tagged release from ghcr.io to Docker Hub once the image workflow has
#   built and pushed it. The copy is by digest, so both registries serve the exact same image.
# overview: publishes DOCKERHUB.md as the Docker Hub repository overview (overwriting it), whenever
#   DOCKERHUB.md changes on main, after each release, and on manual runs.
# Needs repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN. The overview needs the
# token's "Read, Write, Delete" scope; the copy alone would work with "Read & Write".
on:
  workflow_run:
    workflows: [image]
    types: [completed]
  push:
    branches: [main]
    paths: [DOCKERHUB.md]
  # Manual run from the Actions tab: copies the given release (if any) and updates the overview.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to copy, e.g. v1.6.1 (leave empty to only update the overview)"
        required: false

permissions:
  contents: read

jobs:
  copy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') || (
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy release to Docker Hub
        env:
          REF: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          SRC: ghcr.io/${{ github.repository }}
          DST: docker.io/${{ vars.DOCKERHUB_USERNAME }}/coolify-watchtower
        run: |
          # Only release tags like v1.6.1; pushes to main and pre-releases are skipped.
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $REF - nothing to copy."
            exit 0
          fi
          version="${REF#v}"
          src="$(echo "$SRC" | tr '[:upper:]' '[:lower:]'):$version"
          docker buildx imagetools create \
            --tag "$DST:$version" \
            --tag "$DST:${version%.*}" \
            --tag "$DST:${version%%.*}" \
            --tag "$DST:latest" \
            "$src"
          docker buildx imagetools inspect "$DST:$version"

  overview:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/coolify-watchtower
          readme-filepath: ./DOCKERHUB.md
          short-description: Automatic image updates for Coolify services, carried out by Coolify itself.
