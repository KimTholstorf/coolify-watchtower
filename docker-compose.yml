# coolify-watchtower - pulls the prebuilt image from ghcr.io.
# Coolify: + New Resource -> Docker Compose (empty) -> paste this file.
# Set COOLIFY_TOKEN in the Environment Variables tab. Starts in DRY_RUN=true.
# Leave "Connect to Predefined Network" OFF: only the updater joins the coolify network,
# so other containers there can't reach the socket proxy (which exposes container env vars).
services:
  updater:
    image: ghcr.io/kimtholstorf/coolify-watchtower:latest
    environment:
      - COOLIFY_URL=${COOLIFY_URL:-http://coolify:8080}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN}
      - DRY_RUN=${DRY_RUN:-true}
      - TZ=${TZ:-}
      - TASK_NAME=${TASK_NAME:-auto-update}
      - AUTO_UPDATE_LABEL=${AUTO_UPDATE_LABEL:-coolify.auto-update}
      - DEFAULT_SCHEDULE=${DEFAULT_SCHEDULE:-daily}
      - REPORT_ON_START=${REPORT_ON_START:-true}
      - NOTIFY_URL=${NOTIFY_URL:-}
      - DOCKER_HOST=tcp://socket-proxy:2375
    networks:
      - default
      - coolify
    depends_on:
      - socket-proxy
    restart: unless-stopped

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped

networks:
  coolify:
    external: true
